# Настройки Alembic — инструмента миграций.
# Адрес базы здесь НЕ хранится: env.py берёт его из настроек приложения (VS_DATABASE_URL / .env),
# чтобы пароль не попал в git, а миграции шли в ту же базу, что и приложение.
# Логи тоже настраивает env.py — через наш structlog, как у API.

[alembic]
script_location = %(here)s/migrations
# Корень проекта в sys.path: чтобы env.py мог импортировать пакет app
prepend_sys_path = .
path_separator = os

# Имя файла миграции: 0001_users_and_niches.py — номер по порядку и описание.
# Номер (rev) передаём сами через --rev-id, это делает `make migration` (шаг 8).
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# Время в шапке миграции — в UTC, как всё остальное в проекте
timezone = UTC

[post_write_hooks]
# Сгенерированную миграцию сразу прогоняем через ruff: импорты по порядку, стиль как у остального кода
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
