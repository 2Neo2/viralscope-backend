# Grafana сама загружает дашборды из папки observability/grafana/dashboards (шаг 12).
apiVersion: 1

providers:
  - name: viralscope
    folder: ViralScope
    type: file
    disableDeletion: false
    allowUiUpdates: true  # можно править в интерфейсе, но сохранять изменения нужно экспортом в JSON-файл
    options:
      path: /var/lib/grafana/dashboards
